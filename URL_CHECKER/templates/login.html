<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — URL Health Checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>🔍 URL Health Checker</h1>
    <p class="muted">Enter the admin password to continue.</p>
    {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="password" name="password" placeholder="Password" autofocus required>
      <button type="submit" class="btn primary big">Sign in</button>
    </form>
  </div>
</body>
</html>
